# render.yaml — Render Blueprint para SIPCE
# Deploy: conectar el repo y Render detecta este archivo automáticamente.
#
# BASE DE DATOS:
# SIPCE usa PostgreSQL en producción (Render gestiona Postgres sin costo).
# En el dashboard de Render: New -> PostgreSQL -> crear una BD, luego conectar
# las credenciales a las variables DB_* que se piden abajo (use as env var).
services:
  - type: web
    name: sipce
    runtime: docker
    repo: https://github.com/javier01042024/sipce.git
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
    healthCheckPath: /up
    # Los discos persistentes solo existen en planes de pago (Starter+).
    # En free tier, storage/app/backups se pierde al redeployar.
    # Si subes de plan, descomenta:
    # disk:
    #   name: storage-data
    #   mountPath: /var/www/html/storage
    #   sizeGB: 1